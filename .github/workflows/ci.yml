name: ci
on:
  push:
    branches-ignore: [main]      # main is covered by the deploy workflow, which runs this one first
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: enterprisecrm_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build          # type-checks server + web and builds the React app
      - run: npm test               # 33 tests against the PostgreSQL service above
        env: { DATABASE_URL: "postgres://postgres@localhost:5433/enterprisecrm_test" }
