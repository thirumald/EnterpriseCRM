name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs: { image: "${{ steps.n.outputs.image }}" }
    steps:
      - uses: actions/checkout@v4
      - id: n
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.n.outputs.image }}:latest
            ${{ steps.n.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Trigger Render deploy
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set - tests passed and the image was published, but nothing was deployed. See README > Deployment."
            exit 0
          fi
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
          echo "deploy triggered for ${GITHUB_SHA}"
      - name: Wait for the new version to answer /api/health
        run: |
          [ -n "$RENDER_DEPLOY_HOOK_URL" ] && [ -n "$APP_URL" ] || { echo "skipping smoke test (APP_URL variable not set)"; exit 0; }
          for i in $(seq 1 40); do
            if curl -fsS "${APP_URL%/}/api/health" >/dev/null; then echo "healthy"; exit 0; fi
            sleep 15
          done
          echo "::error::service did not become healthy within 10 minutes"; exit 1
