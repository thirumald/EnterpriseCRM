<!doctype html><meta charset="utf-8"><title>CCTV scene renderer</title>
<canvas id="c" width="640" height="360"></canvas>

/* ---------- road: highway / ring road with ANPR ---------- */

}
/* ---------- plaza: crowd analytics ---------- */

/* ---------- port: container yard ---------- */
function port(t, f) {

}
/* ---------- promenade: seafront ---------- */
function promenade(t, f) {
  const sky = g.createLinearGradient(0, 0, 0, 120); sky.addColorStop(0, '#7fb6e6'); sky.addColorStop(1, '#d9ecfa'); g.fillStyle = sky; g.fillRect(0, 0, W, 120);

  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1.5; for (let j = 0; j < 7; j++) { g.beginPath(); for (let x = 0; x <= W; x += 8) { const y = 112 + j * 11 + 2.5 * Math.sin(x / 26 + (2 * Math.PI * t * 2) / T * 2 + j); x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
  g.fillStyle = '#fff'; const bx = wrap(60, 1, t, W, 40); g.beginPath(); g.moveTo(bx, 128); g.lineTo(bx + 34, 128); g.lineTo(bx + 28, 136); g.lineTo(bx + 4, 136); g.fill(); g.fillRect(bx + 14, 118, 3, 10);
  g.fillStyle = '#d8c9a3'; g.fillRect(0, 190, W, 30); g.fillStyle = '#b9b2a4'; g.fillRect(0, 220, W, 140); g.strokeStyle = 'rgba(0,0,0,.08)'; for (let i = 0; i < 20; i++) { g.beginPath(); g.moveTo(i * 36, 220); g.lineTo(i * 36 - (i - 10) * 8, H); g.stroke(); }
  for (let i = 0; i < 7; i++) { const x = 40 + i * 100; g.fillStyle = '#495057'; g.fillRect(x, 150, 4, 74); g.fillStyle = '#ffe9a8'; g.beginPath(); g.arc(x + 2, 150, 6, 0, 7); g.fill(); g.fillStyle = '#6b8f4e'; g.beginPath(); g.arc(x + 50, 202, 16, 0, 7); g.fill(); g.fillRect(x + 48, 202, 4, 22); }
  const ppl = []; for (let i = 0; i < 26; i++) { const a = rng(300 + i), y0 = 232 + a() * 100, sc = 0.7 + ((y0 - 232) / 100) * 0.7, dir = a() > 0.5 ? 1 : -1, laps = 1 + ((a() * 2) | 0), cyc = i % 7 === 0, x = dir > 0 ? wrap(a() * W, cyc ? 2 : laps, t, W, 40) : W - wrap(a() * W, cyc ? 2 : laps, t, W, 40); ppl.push({ x, y: y0, sc, dir, cyc, i }); }

  ppl.filter((p) => p.i % 5 === 0).forEach((p) => box(p.x - 9 * p.sc, p.y - 16 * p.sc, 18 * p.sc, 36 * p.sc, p.cyc ? 'cyclist' : 'person', '#4ade80'));
}
/* ---------- terminal: bus bays ---------- */
function terminal(t, f) {
  g.fillStyle = '#c9d6df'; g.fillRect(0, 0, W, 90); g.fillStyle = '#7b8791'; g.fillRect(0, 70, W, 26); for (let i = 0; i < 8; i++) { g.fillStyle = '#5c6770'; g.fillRect(i * 90 + 30, 96, 8, 120); }
  g.fillStyle = '#4b5258'; g.fillRect(0, 96, W, 264); g.fillStyle = '#6a7279'; g.fillRect(0, 96, W, 30); g.strokeStyle = '#e9e9e9'; g.lineWidth = 2; for (let i = 0; i < 6; i++) { g.beginPath(); g.moveTo(i * 115 + 20, 230); g.lineTo(i * 115 + 60, 340); g.stroke(); }

}
const SCENES = { road, plaza, port, promenade, terminal };
window.draw = (name, t, frame) => { g.clearRect(0, 0, W, H); SCENES[name](t, frame); finish(t, frame, name === 'port' ? 'rgba(255,200,120,.05)' : ''); return cv.toDataURL('image/jpeg', 0.9); };

</script>
